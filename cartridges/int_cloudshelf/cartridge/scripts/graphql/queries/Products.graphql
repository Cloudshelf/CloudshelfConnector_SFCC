query Products($first: Int, $after: String) {
    products(first: $first, after: $after, sortBy: { id: ASC }) {
        edges {
            node {
                id
                platformProvidedId
                productVariants {
                    id
                    platformProvidedId
                }
            }
        }
        pageInfo {
            endCursor
            hasNextPage
        }
        totalCount
    }
}
